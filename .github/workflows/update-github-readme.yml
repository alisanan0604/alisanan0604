name: Update GitHub README stats

on:
  push:
    paths:
      - "scripts/update_github_assets.py"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update stats and heatmap
        run: python scripts/update_github_assets.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/heatmap.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GitHub profile stats"
          git push
