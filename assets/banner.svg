        stroke-width="4"
        stroke-linecap="round"/>

    <!-- BOTTOM LEFT -->
    <path
        d="M40 330 L40 360 L70 360"
        fill="none"
        stroke="#00D9FF"
        stroke-width="4"
        stroke-linecap="round"/>

    <!-- BOTTOM RIGHT -->
    <path
        d="M1240 330 L1240 360 L1210 360"
        fill="none"
        stroke="#00D9FF"
        stroke-width="4"
        stroke-linecap="round"/>

</svg>
