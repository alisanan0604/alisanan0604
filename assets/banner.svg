<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 400"
     width="1280"
     height="400">

    <!-- Background -->
    <rect width="1280" height="400" fill="#0D1117"/>

    <!-- Main Border -->
    <rect
        x="15"
        y="15"
        width="1250"
        height="370"
        rx="8"
        fill="none"
        stroke="#00D9FF"
        stroke-width="2"/>

    <!-- TOP LEFT -->
    <path
        d="M40 70 L40 40 L70 40"
